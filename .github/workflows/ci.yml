name: CI (routine - no database)

# Routine, test-only workflow: never deploys, starts no database service and runs no database test.
# The database, migration, rollback and database-backed browser suite is in ci-database.yml (manual only, on request).
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AIHUB_DB_HOST: 127.0.0.1
      AIHUB_DB_PORT: '1'          # deliberately unreachable: any hidden database dependency fails loudly
      AIHUB_DB_NAME: none
      AIHUB_DB_USER: none
      AIHUB_DB_PASS: none
      AIHUB_RATE_DIR: /tmp/aihub_rate_ci
      AIHUB_SECURITY_LOG: /tmp/aihub_security_ci.log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP syntax check
        run: ./tests/php_lint.sh

      - name: Built assets are current (CSS/JS sources match assets/build.json)
        run: php scripts/build_assets.php --check

      - name: JavaScript syntax check (assets and browser tests)
        run: find assets tests -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: Security regression tests (proxy trust, redirects, CSRF, rate limits, secrets)
        run: php tests/security_test.php

      - name: Secret-initialisation regression
        run: php tests/secret_init_test.php

      - name: Security inventory and secrets scan (every PHP file classified, no secrets in tracked files)
        run: php tests/security_inventory_test.php

      - name: Analytics salt (no visitor hash without a strong salt; tracking off by default)
        run: php tests/analytics_salt_test.php

      - name: Phase 8C tool management (database-free; M1-M7 covering validation, permissions, lifecycle, categories, tags, bulk, submissions, featured, rendering, category safeguards and the 509-tool regression, Phase 8D finance logic, migration and guard checks)
        run: |
          php tests/phase8c_tools_test.php
          php tests/phase8c_tools_m4_m7_test.php
          php tests/phase8c_category_safeguards_test.php
          php tests/phase8d_finance_test.php
          php tests/unified_admin_u1_test.php
          php tests/unified_admin_u2_test.php
          php tests/unified_admin_u3_test.php
          php tests/unified_admin_u4_test.php
          php tests/unified_admin_u5_test.php
          php tests/unified_admin_u6_test.php
          php tests/analytics_a1_test.php
          php tests/analytics_a2_a5_test.php
          php tests/analytics_privacy_test.php
          php tests/analytics_installer_static_test.php
          php tests/analytics_config_test.php

      - name: Phase 8C screens on synthetic data (axe, overflow, 44px targets; desktop, tablet, mobile, light and dark; no database)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE" && php tests/adm_tools_preview.php /tmp/p8c_preview
          NODE_PATH=/tmp/pw/node_modules AXE_PATH=/tmp/pw/node_modules/axe-core/axe.min.js node tests/browser_phase8c_preview_test.js /tmp/p8c_preview

      - name: Phase 8D Finance screens on synthetic data (axe, overflow, 44px targets; desktop, tablet, mobile, light and dark; no database)
        run: |
          php tests/adm_finance_preview.php /tmp/p8d_preview
          NODE_PATH=/tmp/pw/node_modules AXE_PATH=/tmp/pw/node_modules/axe-core/axe.min.js node tests/browser_phase8c_preview_test.js /tmp/p8d_preview

      - name: Unified admin shell on synthetic data (axe, overflow, 44px targets, drawer and keyboard behaviour; no database)
        run: |
          php tests/adm_shell_preview.php /tmp/u1_preview
          NODE_PATH=/tmp/pw/node_modules AXE_PATH=/tmp/pw/node_modules/axe-core/axe.min.js node tests/browser_unified_shell_test.js /tmp/u1_preview

      - name: Analytics dashboard on synthetic data (axe, overflow, 44px targets, light and dark; no database, no tracking)
        run: |
          php tests/adm_analytics_preview.php /tmp/an_preview
          NODE_PATH=/tmp/pw/node_modules AXE_PATH=/tmp/pw/node_modules/axe-core/axe.min.js node tests/browser_unified_shell_test.js /tmp/an_preview

      - name: Localisation tests (registry, hreflang, canonical)
        run: php tests/i18n_test.php

      - name: Content backlog integrity (evidence gates, no invented figures)
        run: php tests/content_backlog_test.php
